name: Check external links

# Monthly scan of outgoing links (PortSwigger labs, CVE trackers, vendor docs).
# Kept separate from the deploy workflow so a flaky external site can never
# block a push to development.

on:
    schedule:
        - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    external-links:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.1"
            - name: Install Dart Sass
              run: |
                  DART_SASS_VERSION=1.90.0
                  curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
                  mkdir -p "${HOME}/.local"
                  tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
                  rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
                  echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
            - name: Install Hugo
              env:
                  HUGO_VERSION: 0.168.0
              run: |
                  curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  mkdir -p "${HOME}/.local/hugo"
                  tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
            - name: Build the site
              run: hugo --gc --minify
            - name: Install htmltest
              run: |
                  curl -sL -o /tmp/htmltest.tar.gz "https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz"
                  mkdir -p "${HOME}/.local/htmltest"
                  tar -C "${HOME}/.local/htmltest" -xzf /tmp/htmltest.tar.gz
                  rm /tmp/htmltest.tar.gz
            - name: Check external links
              env:
                  TZ: Europe/Oslo
              run: |
                  "${HOME}/.local/htmltest/htmltest" -c htmltest-ext.yml
            - name: Report summary
              if: always()
              run: cat tmp/.htmltest/htmltest.log tmp/.htmltest/external-links.log 2>/dev/null || true
