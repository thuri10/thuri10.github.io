name: Build and deploy
on:
    push:
        branches:
            - development
    pull_request:
        branches:
            - development
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: true
defaults:
    run:
        shell: bash
jobs:
    build:
        runs-on: ubuntu-latest
        env:
            DART_SASS_VERSION: 1.90.0
            GO_VERSION: 1.26.1
            HUGO_VERSION: 0.165.0
            NODE_VERSION: 24.19.0
            TZ: Europe/Oslo
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ env.GO_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Setup Pages
              if: github.event_name != 'pull_request'
              id: pages
              uses: actions/configure-pages@v5
            - name: Create directory for user-specific executable files
              run: |
                  mkdir -p "${HOME}/.local"
            - name: Install Dart Sass
              run: |
                  curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
                  tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
                  rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
                  echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
            - name: Install Hugo
              run: |
                  curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  mkdir "${HOME}/.local/hugo"
                  tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
            - name: Verify installations
              run: |
                  echo "Dart Sass: $(sass --version)"
                  echo "Go: $(go version)"
                  echo "Hugo: $(hugo version)"
                  echo "Node.js: $(node --version)"
            - name: Install Node.js dependencies
              run: |
                  [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
            - name: Configure Git
              run: |
                  git config core.quotepath false
            - name: Cache restore
              id: cache-restore
              uses: actions/cache/restore@v4
              with:
                  path: ${{ runner.temp }}/hugo_cache
                  key: hugo-${{ hashFiles('content/**', 'hugo.toml', 'themes/DoIt/go.mod') }}
                  restore-keys: hugo-
            - name: Determine base URL
              id: baseurl
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo "url=${{ github.event.pull_request.head.repo.html_url }}/${{ github.event.pull_request.head.ref }}/" >> "$GITHUB_OUTPUT"
                  else
                    echo "url=${{ steps.pages.outputs.base_url }}/" >> "$GITHUB_OUTPUT"
                  fi
            - name: Build the site
              run: |
                  hugo \
                    --gc \
                    --minify \
                    --enableGitInfo \
                    --forceSyncStatic \
                    --baseURL "${{ steps.baseurl.outputs.url }}" \
                    --cacheDir "${{ runner.temp }}/hugo_cache"
            - name: Validate internal links
              run: |
                  curl -sL -o /tmp/htmltest.tar.gz "https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz"
                  mkdir -p "${HOME}/.local/htmltest"
                  tar -C "${HOME}/.local/htmltest" -xzf /tmp/htmltest.tar.gz
                  rm /tmp/htmltest.tar.gz
                  "${HOME}/.local/htmltest/htmltest" -c htmltest.yml
            - name: Cache save
              if: github.event_name != 'pull_request'
              id: cache-save
              uses: actions/cache/save@v4
              with:
                  path: ${{ runner.temp }}/hugo_cache
                  key: ${{ steps.cache-restore.outputs.cache-primary-key }}
            - name: Upload artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public
    validate:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'pull_request'
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: github-pages
                  path: ./public
            - name: Validate HTML
              uses: chizzco/html-validate-action@v1
              with:
                  path: ./public
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name != 'pull_request'
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
